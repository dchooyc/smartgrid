# Hosting the app on a server, behind HTTPS and a demo password. Used on top
# of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# It needs a .env file beside it, which is not in the repository. Copy
# .env.example to .env and fill it in.

services:
  # The only service reachable from the internet. It serves the frontend and
  # /api/* from one address (see Caddyfile).
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      DEMO_USER: ${DEMO_USER:?set DEMO_USER in .env}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?set DEMO_PASSWORD_HASH in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps the HTTPS certificate between restarts.
      - caddy-data:/data
      - caddy-config:/config

  db:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      # Only pages from the site itself may read the API's responses.
      ALLOWED_ORIGIN: https://${SITE_ADDRESS}
    # Reached through caddy only, not from the internet.
    ports: !reset []

  frontend:
    restart: unless-stopped
    build:
      args:
        # The browser calls the API at the site's own address.
        NEXT_PUBLIC_API_URL: https://${SITE_ADDRESS}
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
