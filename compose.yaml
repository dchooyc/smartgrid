# Runs the whole app: docker compose up --build
# Then open http://localhost:3000
#
# Run the backend tests: docker compose run --rm test
# Start again with an empty database: docker compose down -v

services:
  db:
    image: postgres:18
    environment:
      # Local development credentials only.
      POSTGRES_USER: smartgrid
      POSTGRES_PASSWORD: smartgrid
      POSTGRES_DB: smartgrid
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      # 5433 on this machine, so it does not clash with a local PostgreSQL.
      - "127.0.0.1:5433:5432"
    healthcheck:
      # Checked over the network, not the local socket: on first start the
      # image briefly runs a setup server that only the socket can reach, and
      # the migration must not start until the real server is up.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username smartgrid --dbname smartgrid"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Applies the SQL migrations that have not run yet, then exits.
  migrate:
    image: postgres:18
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://smartgrid:smartgrid@db:5432/smartgrid?sslmode=disable
    volumes:
      - ./scripts/migrate.sh:/app/scripts/migrate.sh:ro
      - ./backend/migrations:/app/backend/migrations:ro
    entrypoint: ["bash", "/app/scripts/migrate.sh"]
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://smartgrid:smartgrid@db:5432/smartgrid?sslmode=disable
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the backend directly, so this is the backend's
        # address as seen from the machine the browser runs on.
        NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # Not started by "up". Runs the Go tests in the backend's build image.
  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: build
    command: ["go", "test", "./..."]

volumes:
  db-data:
